              - list [ref=f3e315]:
                - listitem [ref=f3e316]:
                  - generic [ref=f3e317]: Expert management of project cargo, breakbulk, oversized, and heavy-lift shipments with detailed planning and seamless execution.
                - listitem [ref=f3e318]:
                  - generic [ref=f3e319]: Specialized handling for hazardous, temperature-controlled, perishable, and sensitive cargo while maintaining strict safety and regulatory compliance.
                - listitem [ref=f3e320]:
                  - generic [ref=f3e321]: End-to-end logistics planning and operational coordination, delivering customized solutions backed by experienced professionals and global logistics expertise.
            - img "Specialized Logistics For Complex Cargo." [ref=f3e324]
