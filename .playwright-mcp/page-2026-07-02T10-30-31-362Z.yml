              - generic [ref=f3e248]:
                - text: "01"
                - heading "Ocean Freight That Connects Global Trade." [level=2] [ref=f3e249]
                - paragraph [ref=f3e250]: Reliable ocean freight solutions built to move your cargo seamlessly across international markets. With a strong global carrier network and decades of logistics expertise, we ensure dependable shipping performance from origin to destination.
              - list [ref=f3e251]:
                - listitem [ref=f3e252]:
                  - generic [ref=f3e253]: Reliable FCL and LCL services across major global trade routes, supported by trusted partnerships with leading international ocean carriers.
                - listitem [ref=f3e254]:
                  - generic [ref=f3e255]: Flexible shipping solutions tailored to your cargo, delivery schedules, and business objectives, ensuring efficiency without compromising reliability.
                - listitem [ref=f3e256]:
                  - generic [ref=f3e257]: Complete shipment coordination including documentation, customs support, cargo tracking, and seamless delivery from origin to final destination.
            - img "Ocean Freight That Connects Global Trade." [ref=f3e260]
          - generic [ref=f3e262]:
            - generic [ref=f3e263]:
              - generic [ref=f3e264]:
                - text: "02"
                - heading "Air Freight When Time Matters Most." [level=2] [ref=f3e265]
                - paragraph [ref=f3e266]: Our air freight solutions are designed for businesses that demand speed, precision, and reliability. Backed by a global airline network and experienced logistics professionals, we ensure your shipments reach their destination safely, efficiently, and on schedule.
              - list [ref=f3e267]:
                - listitem [ref=f3e268]:
                  - generic [ref=f3e269]: Fast and dependable air freight services connecting major global destinations with optimized transit times and reliable carrier partnerships.
                - listitem [ref=f3e270]:
                  - generic [ref=f3e271]: Specialized handling for urgent, fragile, high-value, and temperature-controlled shipments, ensuring maximum safety and regulatory compliance.
                - listitem [ref=f3e272]:
                  - generic [ref=f3e273]: End-to-end shipment coordination with documentation support, customs clearance, real-time cargo tracking, and proactive operational updates.
            - img "Air Freight When Time Matters Most." [ref=f3e276]
          - generic [ref=f3e278]:
            - generic [ref=f3e279]:
              - generic [ref=f3e280]:
                - text: "03"
                - heading "Customs Clearance Without Delays." [level=2] [ref=f3e281]
                - paragraph [ref=f3e282]: Our customs clearance solutions are designed to simplify international trade while ensuring full regulatory compliance and efficient cargo movement.
              - list [ref=f3e283]:
                - listitem [ref=f3e284]:
                  - generic [ref=f3e285]: Experienced customs professionals ensuring compliance with evolving international trade regulations and customs requirements.
                - listitem [ref=f3e286]:
                  - generic [ref=f3e287]: Accurate documentation, duty processing, and import-export clearance to facilitate faster cargo movement across global markets.
                - listitem [ref=f3e288]:
                  - generic [ref=f3e289]: Proactive customs coordination that minimizes delays, reduces compliance risks, and keeps your supply chain operating without disruption.
            - img "Customs Clearance Without Delays." [ref=f3e292]
          - generic [ref=f3e294]:
            - generic [ref=f3e295]:
              - generic [ref=f3e296]:
                - text: "04"
                - heading "Integrated Transportation & Warehousing." [level=2] [ref=f3e297]
                - paragraph [ref=f3e298]: Our integrated transportation and warehousing solutions are designed to keep your supply chain efficient, connected, and responsive.
              - list [ref=f3e299]:
                - listitem [ref=f3e300]:
                  - generic [ref=f3e301]: Secure warehousing solutions designed to optimize inventory management, storage efficiency, and order fulfillment.
                - listitem [ref=f3e302]:
                  - generic [ref=f3e303]: Reliable transportation services across diverse cargo categories, ensuring safe, timely, and cost-effective deliveries.
                - listitem [ref=f3e304]:
                  - generic [ref=f3e305]: Integrated logistics support that seamlessly connects warehousing, transportation, and distribution for end-to-end supply chain efficiency.
            - img "Integrated Transportation & Warehousing." [ref=f3e308]
          - generic [ref=f3e310]:
            - generic [ref=f3e311]:
