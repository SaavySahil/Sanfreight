      - generic [ref=e143]:
        - generic [ref=e147]:
          - generic [ref=e148]: Nos expertises
          - heading "Concrétisez vos projets à nos côtés." [level=2] [ref=e149]
        - generic [ref=e155]:
          - generic [ref=e156]:
            - text: "01"
            - heading "La promesse d’une haute qualité architecturale" [level=2] [ref=e157]
            - paragraph [ref=e158]:
              - text: Nous nous efforçons de développer des espaces de vie ou il fait bon vivre.
              - text: Nous adaptons nos espaces aux tendances actuelles et futures, pour en faire des projets d’exception.
          - list [ref=e159]:
            - listitem [ref=e160]:
              - generic [ref=e161]: Veille constante sur les évolutions du design et de l'architecture pour rester à la pointe de l'innovation.
            - listitem [ref=e162]:
              - generic [ref=e163]: Partenariats avec des architectes renommés pour assurer une vision globale et contemporaine.
            - listitem [ref=e164]:
              - generic [ref=e165]: Sélection rigoureuse de matériaux durables, esthétiques et de haute qualité pour garantir à la fois fonctionnalité et beauté.
        - generic [ref=e171]:
          - generic [ref=e172]:
            - text: "02"
            - heading "Un intérieur design et fonctionnel" [level=2] [ref=e173]
            - paragraph [ref=e174]:
              - text: Au-delà des façades et des structures, l'essence même d'un espace réside dans son design intérieur.
              - text: "L'architecture d'intérieur n'est pas une simple après-pensée : elle est au cœur de chaque projet, assurant que chaque espace non seulement séduit visuellement, mais répond aussi a vos besoins besoins fonctionnels."
          - list [ref=e175]:
            - listitem [ref=e176]:
              - generic [ref=e177]: Intégration du design dès le début du processus pour assurer une parfaite harmonie entre l'intérieur et l'extérieur.
            - listitem [ref=e178]:
              - generic [ref=e179]: Adaptation des espaces aux besoins spécifiques des clients, reflétant leur personnalité et leur mode de vie.
            - listitem [ref=e180]:
              - generic [ref=e181]: Sélection de matériaux durables sans compromis sur l'esthétique, assurant une beauté qui dure.
        - generic [ref=e187]:
          - generic [ref=e188]:
            - text: "03"
            - heading "Une vision décarbonée de la construction" [level=2] [ref=e189]
            - paragraph [ref=e190]: Nous challengeons l’approche traditionnelle de la construction pour une approche éco-responsable, en mêlant notre savoir-faire à l’innovation, que ce soit en termes de matériaux, de technologies, ou de méthodes.
          - list [ref=e191]:
            - listitem [ref=e192]:
              - generic [ref=e193]: Intégration des principes écologiques dès la phase de conception, garantissant une réduction significative de notre empreinte carbone.
            - listitem [ref=e194]:
              - generic [ref=e195]: Adoption des dernières innovations en matière de construction écologique, de systèmes énergétiques renouvelables et de matériaux durables.
            - listitem [ref=e196]:
              - generic [ref=e197]: Partenariats avec des entreprises et startups engagées dans la promotion de pratiques de construction respectueuses de l'environnement.
        - generic [ref=e203]:
          - generic [ref=e204]:
            - text: "04"
            - heading "Un achat immobilier en toute sérénité." [level=2] [ref=e205]
            - paragraph [ref=e206]:
              - text: L'achat immobilier est une étape déterminante, souvent source de préoccupations et d'interrogations.
              - text: Nous transformons ce parcours, souvent stressant, en une expérience motivante et rassurante. Du premier contact à la remise des clés, nous vous guidons à chaque pas, garantissant une acquisition en toute confiance.
          - list [ref=e207]:
            - listitem [ref=e208]:
              - generic [ref=e209]: Un accès continu aux détails, avancements et coûts de votre projet, éliminant toute surprise.
            - listitem [ref=e210]:
              - generic [ref=e211]: Un interlocuteur unique tout au long de votre parcours, garantissant une communication fluide et rassurante.
            - listitem [ref=e212]:
              - generic [ref=e213]: Utilisation d'outils digitaux pour une visualisation précise de votre futur bien, vous permettant de vous projeter concrètement dans votre futur chez vous.
        - generic [ref=e219]:
          - generic [ref=e220]:
            - text: "05"
            - heading "Une expertise plurielle de l’immobilier" [level=2] [ref=e221]
            - paragraph [ref=e222]:
              - text: Nous pouvons aussi bien intervenir sur des projets résidentiels, de bureaux que hôtelier ou encore logistique.
              - text: Cette multidisciplinarité nous permet d’adapter parfaitement les espaces en créant des synergies entre les différents besoins des usagers.
          - list [ref=e223]:
            - listitem [ref=e224]:
              - generic [ref=e225]: Regroupement d'experts spécialisés dans chaque secteur – résidentiel, bureaux, hôtelier, logistique – pour garantir une expertise de haut niveau.
            - listitem [ref=e226]:
              - generic [ref=e227]: Analyses régulières des tendances spécifiques à chaque segment pour anticiper les besoins et attentes des usagers.
            - listitem [ref=e228]:
              - generic [ref=e229]: Exploration des meilleures pratiques de chaque secteur pour les transférer et les adapter aux autres, créant ainsi des synergies innovantes.
      - generic [ref=e233]:
