        - heading "Notre stratégie ESG" [level=3] [ref=e327]
        - generic [ref=e328]: Créer des espaces de vie durables.
      - generic [ref=e329]:
        - generic [ref=e331]:
          - generic [ref=e332]:
            - generic [ref=e333]: Notre engagement
            - generic [ref=e334]: L'intégration active des critères ESG
          - generic [ref=e336]:
            - text: Nous sommes conscients de l’impact majeur de l’immobilier sur l’environnement mais aussi de l’importance des enjeux sociaux et de gouvernance dans toute stratégie d’investissement utile et durable, aussi nous nous engageons à agir en tant qu’investisseur responsable et à minimiser les effets de l’exploitation de nos actifs immobiliers.
            - text: MIMCO soutient la durabilité au niveau mondial et s’engage à intégrer activement les dimensions Environnementale, Sociale et de Gouvernance dans la gestion de ses actifs.
        - generic [ref=e339]:
          - generic [ref=e340]:
            - generic [ref=e341]: Notre conviction
            - generic [ref=e342]: Les liens entre performance et impact
          - generic [ref=e344]:
            - text: Chez MIMCO, nous croyons fermement que performance financière et impact environnemental et social sont intrinsèquement liés.
            - text: Nous sommes convaincus qu'une stratégie d'investissement responsable est indissociable d'une création significative de valeur. En d'autres termes, pour nous, la performance d'une entreprise ne peut être considérée indépendamment de son empreinte sur le monde.
        - generic [ref=e347]:
          - generic [ref=e348]:
            - generic [ref=e349]: Notre promesse
            - generic [ref=e350]: La performance durable
          - generic [ref=e352]:
            - text: Nous croyons que la véritable valeur ne peut être créée que par une performance durable. Pour nous, cela signifie investir de manière responsable, gérer nos actifs avec soin et respecter nos engagements envers nos partenaires et actionnaires.
            - text: En plaçant les critères ESG au cœur de notre démarche, nous visons à assurer la performance financière à long terme de nos investissements et à contribuer à un monde meilleur pour tous. C'est notre promesse chez MIMCO.
