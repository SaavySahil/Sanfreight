        - generic [ref=e88]:
          - heading "MIMCO Real Estate" [level=3] [ref=e89]
          - generic [ref=e90]: Nous construisons des espaces de vie qui vous ressemblent.
        - generic [ref=e92]:
          - generic [ref=e93]: Nous concevons des espaces de vie adaptés à vos attentes actuelles et futures.
          - generic [ref=e95]:
            - paragraph [ref=e96]: Pour nous, l'immobilier ne se résume pas à un simple investissement financier ; c'est un moyen de créer des espaces de vie uniques et inspirants, qui répondent aux besoins et aux attentes de nos clients.
            - paragraph [ref=e97]: Nous tirons le plein potentiel de nos projets grâce à notre expertise en matière de revitalisation immobilière. Nous sommes passionnés par la transformation d'anciens bâtiments ou de sites sous-exploités en projets immobiliers d'excellence.
        - generic [ref=e99]:
          - paragraph [ref=e104]: Nous développons des projets adaptés aux modes de vies d'aujourd'hui et demain.
          - paragraph [ref=e109]: Nous concevons des bâtiments contemporains et durables.
          - paragraph [ref=e114]: Pour faire de chaque nouveaux espaces des lieux de vie uniques et inspirants.
