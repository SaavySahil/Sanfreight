              - heading "01 Ocean Freight That Connects Global Trade." [level=4] [ref=e189]
              - paragraph [ref=e190]: We provide reliable ocean freight solutions designed to keep your supply chain moving efficiently across international markets. Whether you require Full Container Load (FCL) or Less than Container Load (LCL) services, our experienced team delivers tailored shipping solutions backed by strong partnerships with leading global carriers.
              - paragraph [ref=e191]: Comprehensive FCL and LCL services across major international trade routes. — Flexible shipping solutions designed around your cargo, timelines, and business requirements. — Reliable coordination from origin to destination with complete shipment visibility.
            - generic [ref=e193]:
